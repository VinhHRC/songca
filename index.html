<style>
  /* Giao diện Bảng điều khiển nổi */
  #reservoir-control-panel {
    position: absolute;
    bottom: 20px; /* Cách đáy màn hình 20px */
    left: 20px;   /* Cách mép trái màn hình 20px */
    width: 440px;

  .control-group {

<div id="reservoir-control-panel">
  <div class="rcp-header" onclick="toggleRCP()">
    <span>🌊 Điều Tiết Lũ Hồ Chứa Sông Cả</span>
    <span id="rcp-toggle-btn">▼</span>
  </div>

  <div class="rcp-tabs">
    <div class="rcp-tab active" onclick="switchRes('banve')">Bản Vẽ</div>
    <div class="rcp-tab" onclick="switchRes('banmong')">Bản Mồng</div>
    <div class="rcp-tab" onclick="switchRes('ngantruoi')">Ngàn Trươi</div>
    <div class="rcp-tab" onclick="switchRes('hoho')">Hố Hô</div>
  </div>

  <div class="rcp-body">
    <!-- Bảng thông số kỹ thuật công trình -->
    <div style="font-weight: bold; margin-bottom: 6px; color: #1e3c72;">📌 Thông Số Kỹ Thuật Công Trình</div>
    <table class="param-badge-table" id="spec-table">
      <!-- Cập nhật tự động bằng JS -->
    </table>

    <!-- Bảng nhập thông số tính toán điều tiết -->
    <div style="font-weight: bold; margin-bottom: 6px; color: #1e3c72; border-top: 1px solid #edf2f7; padding-top: 6px;">
      ⚙️ Tính Toán Điều Tiết Lũ
    </div>
    
    <div class="control-group">
      <label>Mực nước ban đầu $Z_0$ (m):</label>
      <input type="number" step="0.01" id="inp-z0">
    </div>

    <div class="control-group">
      <label>Lưu lượng về hồ trung bình $Q_{về}$ (m³/s):</label>
      <input type="number" step="0.1" id="inp-qin" value="1200">
    </div>

    <div class="control-group">
      <label>Lưu lượng xả công trình $Q_{xả}$ (m³/s):</label>
      <input type="number" step="0.1" id="inp-qout" value="600">
    </div>

    <div class="control-group">
      <label>Khoảng thời gian tính toán $\Delta t$ (giờ):</label>
      <input type="number" step="0.5" id="inp-dt" value="3">
    </div>

    <button class="btn-sim" onclick="runSimulation()">Tính Toán Điều Tiết</button>

    <!-- Kết quả điều tiết -->
    <div class="result-box" id="sim-result">
      <div class="result-item">
        <span>Dung tích đầu ($W_0$):</span>
        <strong id="res-w0">-- triệu m³</strong>
      </div>
      <div class="result-item">
        <span>Độ biến thiên ($\Delta W$):</span>
        <strong id="res-dw">-- triệu m³</strong>
      </div>
      <div class="result-item">
        <span>Dung tích cuối ($W_1$):</span>
        <strong id="res-w1">-- triệu m³</strong>
      </div>
      <div class="result-item" style="border-top: 1px dashed #cbd5e1; padding-top: 4px; margin-top: 4px;">
        <span>Mực nước sau điều tiết ($Z_1$):</span>
        <strong id="res-z1" style="color: #c0392b; font-size: 14px;">-- m</strong>
      </div>
      <div id="res-status"></div>
    </div>
  </div>
</div>

<script>
  // 1. CSDL Thông số công trình và Đường đặc tính Z ~ W
  const RESERVOIR_DATA = {
    banve: {
      name: "Bản Vẽ",
      river: "Sông Nậm Nơn (Sông Cả)",
      specs: [
        { label: "Mực nước chết (MNC)", val: "155.0 m" },
        { label: "Mực nước dâng bình thường (MNDBT)", val: "200.0 m" },
        { label: "Mực nước lũ thiết kế (P=0.5%)", val: "202.8 m" },
        { label: "Mực nước lũ kiểm tra (P=0.02%)", val: "204.6 m" },
        { label: "Dung tích toàn bộ ($W_{tb}$)", val: "1,834.6 triệu m³" },
        { label: "Dung tích hữu ích ($W_{hi}$)", val: "1,383.0 triệu m³" }
      ],
      defaultZ: 195.0,
      curve: [
        { z: 78.5, w: 0 }, { z: 80, w: 0.02 }, { z: 85, w: 0.35 }, { z: 90, w: 1.44 },
        { z: 95, w: 3.65 }, { z: 100, w: 8.47 }, { z: 105, w: 17.1 }, { z: 110, w: 29.9 },
        { z: 115, w: 48.1 }, { z: 120, w: 71.2 }, { z: 125, w: 100.3 }, { z: 130, w: 136.5 },
        { z: 135, w: 181.2 }, { z: 140, w: 234.3 }, { z: 145, w: 296.1 }, { z: 150, w: 367.9 },
        { z: 155, w: 451.6 }, { z: 160, w: 548.2 }, { z: 165, w: 657.2 }, { z: 170, w: 778.9 },
        { z: 175, w: 913.8 }, { z: 180, w: 1063.9 }, { z: 185, w: 1230.7 }, { z: 190, w: 1414.2 },
        { z: 195, w: 1615.1 }, { z: 200, w: 1834.6 }, { z: 205, w: 2075.7 }
      ]
    },
    banmong: {
      name: "Bản Mồng",
      river: "Sông Hiếu",
      specs: [
        { label: "Mực nước chết (MNC)", val: "63.7 m" },
        { label: "Mực nước dâng bình thường (MNDBT)", val: "76.0 m" },
        { label: "Mực nước gia cường (MNLKT P=0.2%)", val: "79.2 m" },
        { label: "Dung tích toàn bộ ($W_{tb}$)", val: "225.5 triệu m³" },
        { label: "Dung tích phòng lũ", val: "48.2 triệu m³" }
      ],
      defaultZ: 73.0,
      curve: [
        { z: 42, w: 0 }, { z: 45, w: 0.01 }, { z: 50, w: 0.89 }, { z: 55, w: 7.47 },
        { z: 60, w: 24.29 }, { z: 65, w: 54.33 }, { z: 70, w: 104.29 }, { z: 75, w: 187.47 },
        { z: 80, w: 320.73 }, { z: 85, w: 520.72 }, { z: 90, w: 809.62 }, { z: 95, w: 1198.67 }
      ]
    },
    ngantruoi: {
      name: "Ngàn Trươi",
      river: "Sông Ngàn Trươi",
      specs: [
        { label: "Mực nước chết (MNC)", val: "26.0 m" },
        { label: "Mực nước dâng bình thường (MNDBT)", val: "52.0 m" },
        { label: "Mực nước lũ thiết kế (P=0.5%)", val: "54.0 m" },
        { label: "Mực nước lũ kiểm tra (P=0.02%)", val: "55.8 m" },
        { label: "Dung tích toàn bộ ($W_{tb}$)", val: "775.7 triệu m³" },
        { label: "Dung tích phòng lũ triều", val: "161.7 triệu m³" }
      ],
      defaultZ: 48.0,
      curve: [
        { z: 6, w: 0.0 }, { z: 11, w: 1.52 }, { z: 16, w: 9.64 }, { z: 21, w: 33.6 },
        { z: 26, w: 81.2 }, { z: 31, w: 153.9 }, { z: 36, w: 254.1 }, { z: 41, w: 381.3 },
        { z: 46, w: 539.3 }, { z: 51, w: 731.1 }, { z: 56, w: 954.1 }, { z: 61, w: 1209.6 }
      ]
    },
    hoho: {
      name: "Hố Hô",
      river: "Sông Ngàn Sâu",
      specs: [
        { label: "Mực nước chết (MNC)", val: "56.0 m" },
        { label: "Mực nước dâng bình thường (MNDBT)", val: "70.0 m" },
        { label: "Mực nước lũ thiết kế (P=0.5%)", val: "72.0 m" },
        { label: "Mực nước lũ kiểm tra (P=0.02%)", val: "74.8 m" },
        { label: "Dung tích toàn bộ ($W_{tb}$)", val: "38.0 triệu m³" },
        { label: "Dung tích phòng lũ", val: "15.0 triệu m³" }
      ],
      defaultZ: 67.5,
      curve: [
        { z: 20.2, w: 0 }, { z: 25, w: 0.2 }, { z: 30, w: 0.57 }, { z: 35, w: 1.8 },
        { z: 40, w: 3.57 }, { z: 45, w: 6.2 }, { z: 50, w: 9.62 }, { z: 55, w: 14.0 },
        { z: 60, w: 19.94 }, { z: 65, w: 27.4 }, { z: 67.5, w: 32.0 }, { z: 70, w: 37.95 },
        { z: 75, w: 54.0 }, { z: 80, w: 72.15 }
      ]
    }
  };

  let currentResKey = 'banve';

  // 2. Chuyển đổi tab hiển thị hồ
  function switchRes(key) {
    currentResKey = key;
    const res = RESERVOIR_DATA[key];

    // Cập nhật tab active
    const tabs = document.querySelectorAll('.rcp-tab');
    const tabKeys = ['banve', 'banmong', 'ngantruoi', 'hoho'];
    tabs.forEach((tab, idx) => {
      if (tabKeys[idx] === key) tab.classList.add('active');
      else tab.classList.remove('active');
    });

    // Điền bảng thông số kỹ thuật
    const specTable = document.getElementById('spec-table');
    let html = `<tr><td style="color:#718096;">Sông/Vị trí:</td><td>${res.river}</td></tr>`;
    res.specs.forEach(s => {
      html += `<tr><td>${s.label}:</td><td>${s.val}</td></tr>`;
    });
    specTable.innerHTML = html;

    // Reset input và kết quả
    document.getElementById('inp-z0').value = res.defaultZ;
    document.getElementById('sim-result').style.display = 'none';
  }

  // 3. Hàm nội suy tuyến tính thuận Z -> W và nghịch W -> Z
  function interpZtoW(zVal, curve) {
    if (zVal <= curve[0].z) return curve[0].w;
    if (zVal >= curve[curve.length - 1].z) return curve[curve.length - 1].w;
    for (let i = 0; i < curve.length - 1; i++) {
      if (zVal >= curve[i].z && zVal <= curve[i + 1].z) {
        const ratio = (zVal - curve[i].z) / (curve[i + 1].z - curve[i].z);
        return curve[i].w + ratio * (curve[i + 1].w - curve[i].w);
      }
    }
    return 0;
  }

  function interpWtoZ(wVal, curve) {
    if (wVal <= curve[0].w) return curve[0].z;
    if (wVal >= curve[curve.length - 1].w) return curve[curve.length - 1].z;
    for (let i = 0; i < curve.length - 1; i++) {
      if (wVal >= curve[i].w && wVal <= curve[i + 1].w) {
        const ratio = (wVal - curve[i].w) / (curve[i + 1].w - curve[i].w);
        return curve[i].z + ratio * (curve[i + 1].z - curve[i].z);
      }
    }
    return curve[0].z;
  }

  // 4. Giải bài toán điều tiết lũ: delta_W = (Q_ve - Q_xa) * dt
  function runSimulation() {
    const res = RESERVOIR_DATA[currentResKey];
    const z0 = parseFloat(document.getElementById('inp-z0').value);
    const qIn = parseFloat(document.getElementById('inp-qin').value);
    const qOut = parseFloat(document.getElementById('inp-qout').value);
    const dt = parseFloat(document.getElementById('inp-dt').value);

    if (isNaN(z0) || isNaN(qIn) || isNaN(qOut) || isNaN(dt)) {
      alert("Vui lòng điền đầy đủ các thông số hợp lệ!");
      return;
    }

    // Tra W0 theo Z0
    const w0 = interpZtoW(z0, res.curve);

    // deltaW (triệu m3) = (Q_den - Q_xa) (m3/s) * dt (h) * 3600 / 1e6
    const deltaW = ((qIn - qOut) * (dt * 3600)) / 1000000.0;
    const w1 = Math.max(0, w0 + deltaW);

    // Tra Z1 theo W1
    const z1 = interpWtoZ(w1, res.curve);

    // Hiển thị kết quả
    document.getElementById('res-w0').innerText = w0.toFixed(2) + " tr.m³";
    document.getElementById('res-dw').innerText = (deltaW >= 0 ? "+" : "") + deltaW.toFixed(2) + " tr.m³";
    document.getElementById('res-w1').innerText = w1.toFixed(2) + " tr.m³";
    document.getElementById('res-z1').innerText = z1.toFixed(2) + " m";

    // Phân tích trạng thái cảnh báo mực nước
    const statusDiv = document.getElementById('res-status');
    let mndbt = 200.0;
    if (currentResKey === 'banmong') mndbt = 76.0;
    else if (currentResKey === 'ngantruoi') mndbt = 52.0;
    else if (currentResKey === 'hoho') mndbt = 70.0;

    if (z1 > mndbt) {
      statusDiv.innerHTML = `<span class="status-tag status-danger">⚠️ Vượt MNDBT (+${(z1 - mndbt).toFixed(2)}m) - Cần tăng lưu lượng xả tràn!</span>`;
    } else if (z1 >= mndbt - 1.5) {
      statusDiv.innerHTML = `<span class="status-tag status-alert">⚡ Mực nước cận MNDBT (còn ${(mndbt - z1).toFixed(2)}m dung tích phòng lũ)</span>`;
    } else {
      statusDiv.innerHTML = `<span class="status-tag status-normal">✅ Mực nước an toàn dưới MNDBT</span>`;
    }

    document.getElementById('sim-result').style.display = 'block';
  }

  // 5. Thu gọn / Mở rộng bảng điều khiển
  function toggleRCP() {
    const body = document.querySelector('.rcp-body');
    const tabs = document.querySelector('.rcp-tabs');
    const icon = document.getElementById('rcp-toggle-btn');
    if (body.style.display === 'none') {
      body.style.display = 'block';
      tabs.style.display = 'flex';
      icon.innerText = '▼';
    } else {
      body.style.display = 'none';
      tabs.style.display = 'none';
      icon.innerText = '▲';
    }
  }

  // Khởi tạo hiển thị tab mặc định (Bản Vẽ)
  document.addEventListener('DOMContentLoaded', () => {
    switchRes('banve');
  });
</script>
